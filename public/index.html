const MAX_MYTHIC_PICKS = 1;

function effectiveness(moveType, defTypes) {
  let m = 1;
  defTypes.forEach((dt) => {
    const v = CHART[moveType]?.[dt];
    if (v !== undefined) m *= v;
  });
  return m;
}

function buildMoveset(types, tier) {
  const pool = [{ name: "Scrap", power: 40, type: "wild" }];
  types.forEach((t) => (TYPE_MOVES[t] || []).slice(0, tier).forEach((m) => pool.push({ ...m, type: t })));
  const seen = new Set();
  const uniq = pool.filter((m) => (seen.has(m.name) ? false : (seen.add(m.name), true)));
  const rest = uniq.filter((m) => m.name !== "Scrap").sort(() => Math.random() - 0.5).slice(0, 3);
  return [uniq[0], ...rest];
}

// Deterministic PRNG (mulberry32) so a creature's stats and art are stable
// across sessions without needing to store raw numbers anywhere.
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function statsForCreature(id, tier) {
  const rand = mulberry32(id * 7919 + 13);
  const base = tier === 1 ? 26 : tier === 2 ? 45 : 68;
  const spread = 14;
  const stat = () => Math.max(15, Math.round(base + (rand() - 0.5) * 2 * spread));
  return { hp: stat(), attack: stat(), defense: stat(), speed: stat() };
}

function materializeCreature(base) {
  const stats = statsForCreature(base.id, base.tier);
  const maxHp = stats.hp * 3;
  return {
    id: base.id,
    name: base.name,
    types: base.types,
    tier: base.tier,
    mythic: !!base.mythic,
    stats,
    moves: buildMoveset(base.types, base.tier),
    maxHp,
    currentHp: maxHp,
  };
}

function getCreature(id) {
  const base = CREATURES_BASE.find((c) => c.id === id);
  return base ? materializeCreature(base) : null;
}

function shuffle(arr) {
  return [...arr].sort(() => Math.random() - 0.5);
}

// All creature data lives locally — no network fetch, so this can never
// hang, rate-limit, or fail. excludeIds keeps already-picked creatures out
// of later pool refreshes within the same draft.
function getPool(min, max, count, excludeIds) {
  const excluded = new Set(excludeIds || []);
  const candidates = CREATURES_BASE.filter((c) => c.id >= min && c.id <= max && !excluded.has(c.id));
  return shuffle(candidates).slice(0, count).map(materializeCreature);
}

function computeDamage(attacker, defender, move) {
  const stab = attacker.types.includes(move.type) ? 1.5 : 1;
  const eff = effectiveness(move.type, defender.types);
  const rand = 0.85 + Math.random() * 0.15;
  const crit = Math.random() < 1 / 16;
  const base = ((2 * 50 / 5 + 2) * move.power * (attacker.stats.attack / defender.stats.defense)) / 50 + 2;
  return { dmg: Math.max(1, Math.round(base * stab * eff * rand * (crit ? 1.5 : 1))), eff, crit };
}

function isSwitchAction(a) {
  return !!a && typeof a === "object" && "switchIdx" in a;
}
function isBattleAction(a) {
  return typeof a === "number" || isSwitchAction(a);
}

function resolveTurn(match, p1Action, p2Action) {
  const p1 = match.p1, p2 = match.p2;
  let p1Idx = match.activeIdx[p1];
  let p2Idx = match.activeIdx[p2];
  const newLog = [];

  const p1Switch = isSwitchAction(p1Action);
  const p2Switch = isSwitchAction(p2Action);
  if (p1Switch) {
    p1Idx = p1Action.switchIdx;
    newLog.push(`${match.p1Name} withdraws ${match.teams[p1][match.activeIdx[p1]].name}! Go, ${match.teams[p1][p1Idx].name}!`);
  }
  if (p2Switch) {
    p2Idx = p2Action.switchIdx;
    newLog.push(`${match.p2Name} withdraws ${match.teams[p2][match.activeIdx[p2]].name}! Go, ${match.teams[p2][p2Idx].name}!`);
  }

  const p1Mon = match.teams[p1][p1Idx];
  const p2Mon = match.teams[p2][p2Idx];
  let hp1 = p1Mon.currentHp, hp2 = p2Mon.currentHp;

  const steps = [];
  if (!p1Switch && typeof p1Action === "number") steps.push({ side: "p1", move: p1Mon.moves[p1Action] });
  if (!p2Switch && typeof p2Action === "number") steps.push({ side: "p2", move: p2Mon.moves[p2Action] });
  if (steps.length === 2) {
    const p1First = p1Mon.stats.speed === p2Mon.stats.speed ? Math.random() < 0.5 : p1Mon.stats.speed > p2Mon.stats.speed;
    if (!p1First) steps.reverse();
  }

  for (const step of steps) {
    if (step.side === "p1" && hp1 <= 0) continue;
    if (step.side === "p2" && hp2 <= 0) continue;
    const atk = step.side === "p1" ? p1Mon : p2Mon;
    const def = step.side === "p1" ? p2Mon : p1Mon;
    const atkName = step.side === "p1" ? match.p1Name : match.p2Name;
    const { dmg, eff, crit } = computeDamage(atk, def, step.move);
    newLog.push(`${atk.name} (${atkName}) used ${step.move.name}!`);
    if (crit) newLog.push("A critical hit!");
    if (eff === 0) newLog.push("It has no effect...");
    else if (eff > 1) newLog.push("It's super effective!");
    else if (eff < 1) newLog.push("It's not very effective...");
    if (step.side === "p1") hp2 = Math.max(0, hp2 - dmg);
    else hp1 = Math.max(0, hp1 - dmg);
  }
  if (hp2 <= 0) newLog.push(`${p2Mon.name} fainted!`);
  if (hp1 <= 0) newLog.push(`${p1Mon.name} fainted!`);

  const newP1Team = match.teams[p1].map((m, i) => (i === p1Idx ? { ...m, currentHp: hp1 } : m));
  const newP2Team = match.teams[p2].map((m, i) => (i === p2Idx ? { ...m, currentHp: hp2 } : m));
  const p1Alive = newP1Team.some((m) => m.currentHp > 0);
  const p2Alive = newP2Team.some((m) => m.currentHp > 0);

  let status = match.status, winner = null, pendingSwitch = null;
  if (!p1Alive) { status = "over"; winner = p2; }
  else if (!p2Alive) { status = "over"; winner = p1; }
  else if (hp2 <= 0) pendingSwitch = p2;
  else if (hp1 <= 0) pendingSwitch = p1;

  return {
    ...match,
    activeIdx: { ...match.activeIdx, [p1]: p1Idx, [p2]: p2Idx },
    teams: { ...match.teams, [p1]: newP1Team, [p2]: newP2Team },
    log: [...match.log, ...newLog],
    status, winner, pendingSwitch,
    turnCounter: (match.turnCounter || 0) + 1,
  };
}

function genCode() {
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let c = "";
  for (let i = 0; i < 5; i++) c += chars[Math.floor(Math.random() * chars.length)];
  return c;
}

function nextPow2(n) {
  let p = 1;
  while (p < n) p *= 2;
  return p;
}

function generateRound(playerIds, roundNum, season) {
  const shuffled = shuffle(playerIds);
  const byesNeeded = nextPow2(shuffled.length) - shuffled.length;
  const byePlayers = shuffled.slice(0, byesNeeded);
  const pairPlayers = shuffled.slice(byesNeeded);
  const matchups = [];
  let idx = 0;
  const prefix = `s${season || 1}r${roundNum}m`;
  byePlayers.forEach((pid) => {
    matchups.push({ id: `${prefix}${idx++}`, p1: pid, p2: null, winner: pid });
  });
  for (let i = 0; i < pairPlayers.length; i += 2) {
    matchups.push({ id: `${prefix}${idx++}`, p1: pairPlayers[i], p2: pairPlayers[i + 1], winner: null });
  }
  return matchups;
}

function nameOf(room, pid) {
  return room?.players?.find((p) => p.id === pid)?.name || "???";
}

function buildFreshMatch(room, mu) {
  const p1 = mu.p1, p2 = mu.p2;
  return {
    id: mu.id, p1, p2,
    p1Name: nameOf(room, p1), p2Name: nameOf(room, p2),
    teams: {
      [p1]: room.teams[p1].map((m) => ({ ...m, currentHp: m.maxHp })),
      [p2]: room.teams[p2].map((m) => ({ ...m, currentHp: m.maxHp })),
    },
    activeIdx: { [p1]: null, [p2]: null },
    status: "choose-lead",
    pendingSwitch: null,
    log: [`${nameOf(room, p1)} vs ${nameOf(room, p2)}!`],
    turnCounter: 0,
    winner: null,
  };
}

async function storageGet(key, shared = true) {
  try {
    if (!shared) {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    }
    const res = await fetch(`/api/kv/${encodeURIComponent(key)}`);
    if (res.status === 404) return null;
    if (!res.ok) return null;
    const r = await res.json();
    return r && r.value !== undefined ? JSON.parse(r.value) : null;
  } catch {
    return null;
  }
}
async function storageSet(key, value, shared = true) {
  try {
    if (!shared) {
      localStorage.setItem(key, JSON.stringify(value));
      return;
    }
    await fetch(`/api/kv/${encodeURIComponent(key)}`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ value: JSON.stringify(value) }),
    });
  } catch (e) {
    console.error("storage set failed", e);
  }
}
async function storageDelete(key, shared = true) {
  try {
    if (!shared) {
      localStorage.removeItem(key);
      return;
    }
    await fetch(`/api/kv/${encodeURIComponent(key)}`, { method: "DELETE" });
  } catch {
    // key may not exist yet - fine to ignore
  }
}

async function commitIfRevMatches(key, fresh, updated) {
  const check = await storageGet(key);
  if (!check || check.rev !== fresh.rev) return false;
  await storageSet(key, updated);
  return true;
}
async function commitIfTurnMatches(key, fresh, updated) {
  const check = await storageGet(key);
  if (!check || check.turnCounter !== fresh.turnCounter) return false;
  await storageSet(key, updated);
  return true;
}

let audioCtx = null;
function getAudioCtx() {
  try {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
    }
    if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
    return audioCtx;
  } catch {
    return null;
  }
}
function beep(freq, duration, type, gainLevel, delay) {
  try {
    const ctx = getAudioCtx();
    if (!ctx) return;
    const start = ctx.currentTime + (delay || 0);
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || "square";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(gainLevel || 0.15, start);
    gain.gain.exponentialRampToValueAtTime(0.001, start + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(start);
    osc.stop(start + duration + 0.02);
  } catch {
    // audio is a nice-to-have, never let it break the game
  }
}
function playSfx(name) {
  if (name === "hit") beep(170, 0.12, "square", 0.16);
  else if (name === "crit") { beep(140, 0.06, "square", 0.2); beep(280, 0.14, "square", 0.2, 0.07); }
  else if (name === "faint") { beep(320, 0.09, "sawtooth", 0.14); beep(220, 0.09, "sawtooth", 0.14, 0.1); beep(120, 0.22, "sawtooth", 0.14, 0.2); }
  else if (name === "lock") beep(520, 0.06, "square", 0.1);
  else if (name === "reaction") beep(880, 0.08, "sine", 0.12);
  else if (name === "victory") [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.2, "square", 0.15, i * 0.14));
}

function TypeChip({ t }) {
  return (

}
function MythicBadge() {
  return (
    <span style={{ background: "#E8B23D", color: "#12141C" }} className="px-2 py-0.5 rounded-full text-[9px] font-black uppercase tracking-wide">

function HpBar({ hp, maxHp }) {
  const pct = Math.max(0, (hp / maxHp) * 100);
  const color = pct > 50 ? "#3FA796" : pct > 20 ? "#E8B23D" : "#D64545";
  return (
    <div style={{ background: "#1c1e2a", border: "2px solid #262433" }} className="w-full h-3 rounded-full overflow-hidden">
      <div style={{ width: `${pct}%`, background: color, transition: "width 0.4s ease" }} className="h-full" />
    </div>
  );
}

function shadeColor(hex, percent) {
  const num = parseInt(hex.slice(1), 16);
  let r = (num >> 16) + percent;
  let g = ((num >> 8) & 0x00ff) + percent;
  let b = (num & 0x0000ff) + percent;
  r = Math.max(Math.min(255, r), 0);
  g = Math.max(Math.min(255, g), 0);
  b = Math.max(Math.min(255, b), 0);
  return "#" + (0x1000000 + r * 0x10000 + g * 0x100 + b).toString(16).slice(1);
}

// Which silhouette family a creature's primary type renders as.
const ARCHETYPE_BY_TYPE = {
  ember: "beast", volt: "beast", wild: "beast",
  iron: "armor", stone: "armor",
  tide: "aquatic",
  bloom: "flora",
  frost: "crystal",
  gale: "aerial",
  mind: "spirit", shade: "spirit",
  venom: "ooze",
};

// Fully original, procedurally-generated creature art — a deterministic
// SVG creature built from the creature's id (silhouette family comes from
// its primary type, fine details from a seeded RNG). No external images,
// no copyright exposure, and it can never fail to load since nothing is
// fetched — it's just math.
function MonsterArt({ creature, size, flip }) {
  const px = size || 96;
  if (!creature) {
    return (
      <div style={{ width: px, height: px }} className="flex items-center justify-center text-3xl opacity-40">?</div>
    );
  }
  const rand = mulberry32(creature.id * 104729 + 7);
  const primary = TYPE_COLORS[creature.types[0]] || "#888";
  const secondary = creature.types[1] ? (TYPE_COLORS[creature.types[1]] || "#666") : shadeColor(primary, -35);
  const light = shadeColor(primary, 55);
  const dark = shadeColor(primary, -45);
  const outline = "#20202c";
  const archetype = ARCHETYPE_BY_TYPE[creature.types[0]] || "beast";
  const gradId = `bf-grad-${creature.id}-${px}`;
  const hasHorns = rand() > 0.5 && !["flora", "crystal", "spirit"].includes(archetype);
  const hasSpots = rand() > 0.45;
  const eyeGlow = creature.tier >= 3;
  const scale = 0.82 + creature.tier * 0.08;
  const spots = hasSpots
    ? Array.from({ length: 2 + Math.floor(rand() * 3) }, () => ({ cx: 34 + rand() * 32, cy: 50 + rand() * 20, r: 2.5 + rand() * 2.5 }))
    : [];

  function bodyShape() {
    switch (archetype) {
      case "aquatic":
        return <path d="M 50 30 C 68 30 80 42 80 58 C 80 74 66 82 50 82 C 34 82 20 74 20 58 C 20 42 32 30 50 30 Z" fill={`url(#${gradId})`} stroke={outline} strokeWidth="2.2" />;
      case "flora":
        return <ellipse cx="50" cy="58" rx="30" ry="27" fill={`url(#${gradId})`} stroke={outline} strokeWidth="2.2" />;
      case "crystal":
        return <polygon points="50,26 74,46 66,82 34,82 26,46" fill={`url(#${gradId})`} stroke={outline} strokeWidth="2.2" strokeLinejoin="round" />;
      case "aerial":
        return <ellipse cx="50" cy="56" rx="26" ry="28" fill={`url(#${gradId})`} stroke={outline} strokeWidth="2.2" />;
      case "spirit":
        return <ellipse cx="50" cy="54" rx="27" ry="30" fill={`url(#${gradId})`} stroke={outline} strokeWidth="2.2" opacity="0.95" />;
      case "ooze":
        return <path d="M 50 28 C 66 30 78 46 76 62 C 74 78 60 84 50 84 C 40 84 26 78 24 62 C 22 46 34 30 50 28 Z" fill={`url(#${gradId})`} stroke={outline} strokeWidth="2.2" />;
      case "armor":
        return <path d="M 32 40 L 50 30 L 68 40 L 70 62 L 50 84 L 30 62 Z" fill={`url(#${gradId})`} stroke={outline} strokeWidth="2.2" strokeLinejoin="round" />;
      default:
        return <ellipse cx="50" cy="58" rx="30" ry="26" fill={`url(#${gradId})`} stroke={outline} strokeWidth="2.2" />;
    }
  }

  function extras() {
    switch (archetype) {
      case "aquatic":
        return (
          <>
            <path d="M 50 30 Q 56 18 62 28 Q 56 26 50 30" fill={dark} stroke={outline} strokeWidth="1.3" />
            <path d="M 82 58 Q 94 50 90 66 Q 86 62 82 58" fill={secondary} stroke={outline} strokeWidth="1.3" />
          </>
        );
      case "flora":
        return (
          <>
            <polygon points="50,30 44,14 56,14" fill={secondary} stroke={outline} strokeWidth="1.2" />
            <polygon points="38,34 28,22 42,26" fill={secondary} stroke={outline} strokeWidth="1.2" />
            <polygon points="62,34 72,22 58,26" fill={secondary} stroke={outline} strokeWidth="1.2" />
          </>
        );
      case "crystal":
        return <polygon points="50,26 58,38 42,38" fill={light} opacity="0.6" />;
      case "aerial":
        return (
          <>
            <ellipse cx="20" cy="52" rx="13" ry="8" fill={secondary} stroke={outline} strokeWidth="1.5" transform="rotate(-25 20 52)" />
            <ellipse cx="80" cy="52" rx="13" ry="8" fill={secondary} stroke={outline} strokeWidth="1.5" transform="rotate(25 80 52)" />
            <polygon points="44,52 56,52 50,62" fill="#E8B23D" stroke={outline} strokeWidth="1" />
          </>
        );
      case "spirit":
        return (
          <>
            <path d="M 30 78 Q 26 88 30 96" stroke={secondary} strokeWidth="4" fill="none" strokeLinecap="round" opacity="0.7" />
            <path d="M 50 82 Q 50 92 50 98" stroke={secondary} strokeWidth="4" fill="none" strokeLinecap="round" opacity="0.7" />
            <path d="M 70 78 Q 74 88 70 96" stroke={secondary} strokeWidth="4" fill="none" strokeLinecap="round" opacity="0.7" />
          </>
        );
      case "ooze":
        return (
          <>
            <ellipse cx="38" cy="84" rx="5" ry="7" fill={primary} opacity="0.85" />
            <ellipse cx="60" cy="86" rx="4" ry="6" fill={primary} opacity="0.85" />
          </>
        );
      case "armor":
        return <polygon points="50,30 54,42 46,42" fill={light} opacity="0.7" />;
      default:
        return (
          <>
            <rect x="33" y="80" width="9" height="11" rx="3" fill={dark} />
            <rect x="58" y="80" width="9" height="11" rx="3" fill={dark} />
            <path d="M 76 58 Q 86 48 80 36" stroke={secondary} strokeWidth="5" fill="none" strokeLinecap="round" />
          </>
        );
    }
  }

  return (
    <svg width={px} height={px} viewBox="0 0 100 100" style={{ transform: flip ? "scaleX(-1)" : "none" }}>
      <defs>
        <radialGradient id={gradId} cx="35%" cy="30%" r="75%">
          <stop offset="0%" stopColor={light} />
          <stop offset="55%" stopColor={primary} />
          <stop offset="100%" stopColor={dark} />
        </radialGradient>
      </defs>
      <ellipse cx="50" cy="92" rx="24" ry="5" fill="#000" opacity="0.25" />
      {creature.tier >= 3 && (
        <circle cx="50" cy="56" r="42" fill="none" stroke={creature.mythic ? "#E8B23D" : primary} strokeWidth="1.5" strokeDasharray="4 3" opacity="0.4" />
      )}
      {creature.mythic && <text x="76" y="22" fontSize="14" fill="#E8B23D">✦</text>}
      <g transform={`translate(50 58) scale(${scale}) translate(-50 -58)`}>
        {extras()}
        {bodyShape()}
        {spots.map((s, i) => <circle key={i} cx={s.cx} cy={s.cy} r={s.r} fill={secondary} opacity="0.55" />)}
        {hasHorns && (
          <>
            <polygon points="40,34 43,20 48,35" fill={secondary} stroke={outline} strokeWidth="1" />
            <polygon points="52,35 57,20 60,34" fill={secondary} stroke={outline} strokeWidth="1" />
          </>
        )}
        <ellipse cx="40" cy="52" rx="6.5" ry="7.5" fill="white" />
        <ellipse cx="60" cy="52" rx="6.5" ry="7.5" fill="white" />
        <circle cx="40" cy="53.5" r={eyeGlow ? 3.6 : 3.2} fill={eyeGlow ? secondary : "#12141C"} />
        <circle cx="60" cy="53.5" r={eyeGlow ? 3.6 : 3.2} fill={eyeGlow ? secondary : "#12141C"} />
        <circle cx="38" cy="50.5" r="1.6" fill="white" opacity="0.9" />
        <circle cx="58" cy="50.5" r="1.6" fill="white" opacity="0.9" />
      </g>
    </svg>
  );
}

// Derives a type's full effectiveness profile from CHART: which types it
// hits hard (2x), which resist it (0.5x), and which are immune (0x).
// Anything not listed is average (1x) — omission carries that meaning.
function typeRelations(t) {
  const strong = [], weak = [], immune = [];
  Object.keys(TYPE_COLORS).forEach((def) => {
    const v = CHART[t]?.[def];
    if (v === 2) strong.push(def);
    else if (v === 0) immune.push(def);
    else if (v === 0.5) weak.push(def);
  });
  return { strong, weak, immune };
}

function TypeChart({ onClose }) {
  const types = Object.keys(TYPE_COLORS);
  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(18,20,28,0.97)", zIndex: 70, overflowY: "auto" }} className="p-4">
      <div className="max-w-md mx-auto flex flex-col gap-4 pb-10">
        <div className="flex items-center justify-between sticky top-0 pt-1 pb-2" style={{ background: "rgba(18,20,28,0.97)" }}>
          <div style={{ fontFamily: "'Press Start 2P', monospace", fontSize: "11px" }} className="text-[#E8B23D]">TYPE CHART</div>
          <button onClick={onClose} style={{ background: "#D64545" }} className="text-white text-xs font-bold px-3 py-1.5 rounded-lg active:scale-95 transition">CLOSE</button>
        </div>
        <p className="text-xs opacity-70 -mt-2">What each type does extra, reduced, or zero damage against. Anything not listed is average (1×) damage.</p>
        <div className="flex flex-col gap-2">
          {types.map((t) => {
            const { strong, weak, immune } = typeRelations(t);
            return (
              <div key={t} style={{ background: "#EFE6D0", color: "#262433", border: "3px solid #262433" }} className="rounded-xl p-3">
                <div className="mb-2"><TypeChip t={t} /></div>
                <div className="text-xs flex flex-col gap-1.5">
                  <div className="flex flex-wrap gap-1 items-center">
                    <span className="font-bold text-[#3FA796] mr-1">Strong vs</span>
                    {strong.length ? strong.map((d) => <TypeChip key={d} t={d} />) : <span className="opacity-50">none</span>}
                  </div>
                  <div className="flex flex-wrap gap-1 items-center">
                    <span className="font-bold text-[#D64545] mr-1">Weak vs</span>
                    {weak.length ? weak.map((d) => <TypeChip key={d} t={d} />) : <span className="opacity-50">none</span>}
                  </div>
                  {immune.length > 0 && (
                    <div className="flex flex-wrap gap-1 items-center">
                      <span className="font-bold mr-1" style={{ color: "#4A4361" }}>No effect vs</span>
                      {immune.map((d) => <TypeChip key={d} t={d} />)}
                    </div>
                  )}
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function Confetti() {
  const colors = ["#D64545", "#E8B23D", "#3FA796", "#EFE6D0", "#A98FF3"];
  const pieces = Array.from({ length: 44 }, (_, i) => i);
  return (
    <div style={{ position: "fixed", inset: 0, pointerEvents: "none", overflow: "hidden", zIndex: 50 }}>
      {pieces.map((i) => {
        const left = Math.random() * 100;
        const delay = Math.random() * 0.7;
        const dur = 2.2 + Math.random() * 1.6;
        const size = 6 + Math.random() * 6;
        return (
          <div
            key={i}
            style={{
              position: "absolute", top: "-24px", left: `${left}%`,
              width: size, height: size * 1.6,
              background: colors[i % colors.length],
              transform: `rotate(${Math.random() * 360}deg)`,
              animation: `bf-confetti-fall ${dur}s linear ${delay}s forwards`,
            }}
          />
        );
      })}
    </div>
  );
}

function BracketOverview({ room, myId, onWatch }) {
  const mu = room.bracket?.matchups.find((m) => m.p1 === myId || m.p2 === myId);
  let status = "eliminated";
  if (mu) {
    if (!mu.p2) status = "bye";
    else if (mu.winner) status = mu.winner === myId ? "advancing" : "eliminated";
    else status = "waiting";
  }
  return (
    <div className="w-full max-w-md flex flex-col gap-3 items-center">
      <div style={{ fontFamily: "'Press Start 2P', monospace", fontSize: "10px" }} className="text-[#E8B23D]">ROUND {room.bracket?.round}</div>
      {status === "bye" && <p className="text-xs text-center text-[#3FA796]">You got a bye this round — advancing automatically! Waiting for other matches…</p>}
      {status === "eliminated" && <p className="text-xs text-center text-[#D64545]">You were eliminated. Watch a live match below, or wait for the bracket to progress.</p>}
      {status === "waiting" && <p className="text-xs text-center opacity-70">Loading your match…</p>}
      <div className="w-full flex flex-col gap-1">
        {(room.bracket?.matchups || []).map((m) => (
          <div key={m.id} style={{ background: "#EFE6D0", color: "#262433", border: "3px solid #262433" }} className="rounded-lg px-3 py-2 text-xs flex items-center justify-between gap-2">
            <span className="font-bold">
              {nameOf(room, m.p1)} {m.p2 ? `vs ${nameOf(room, m.p2)}` : "(bye)"}
            </span>
            {m.winner ? (
              <span className="opacity-70 whitespace-nowrap">→ {nameOf(room, m.winner)}</span>
            ) : m.p2 ? (
              <button onClick={() => onWatch(m.id)} style={{ background: "#3FA796" }} className="text-white text-[10px] font-bold px-2 py-1 rounded-lg whitespace-nowrap active:scale-95 transition">
                🔴 WATCH
              </button>
            ) : (
              <span className="opacity-70 whitespace-nowrap">in progress</span>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

function SpectatorView({ spectatedMatch, onBack }) {
  const panel = { background: "#EFE6D0", color: "#262433", border: "3px solid #262433" };
  const display = { fontFamily: "'Press Start 2P', monospace" };
  if (!spectatedMatch) {
    return (
      <div className="w-full max-w-md flex flex-col gap-3 items-center">
        <div className="text-center text-xs opacity-70 py-6 animate-pulse">Loading match…</div>
        <button onClick={onBack} className="text-xs opacity-60 underline">back to bracket</button>
      </div>
    );
  }
  const p1Active = spectatedMatch.teams?.[spectatedMatch.p1]?.[spectatedMatch.activeIdx?.[spectatedMatch.p1]];
  const p2Active = spectatedMatch.teams?.[spectatedMatch.p2]?.[spectatedMatch.activeIdx?.[spectatedMatch.p2]];
  return (
    <div className="w-full max-w-md flex flex-col gap-2">
      <div style={{ ...display, fontSize: "9px" }} className="text-center text-[#D64545]">
        🔴 LIVE · {spectatedMatch.p1Name} vs {spectatedMatch.p2Name}
      </div>

      {spectatedMatch.status === "choose-lead" ? (
        <div className="text-center text-xs opacity-70 py-6">Both trainers are choosing their lead creature…</div>
      ) : spectatedMatch.status === "over" ? (
        <div style={{ ...display, fontSize: "11px", color: "#3FA796" }} className="text-center py-6">
          {spectatedMatch.winner === spectatedMatch.p1 ? spectatedMatch.p1Name : spectatedMatch.p2Name} won this match!
        </div>
      ) : p1Active && p2Active ? (
        <>
          <div style={panel} className="rounded-2xl p-3 flex items-center justify-between">
            <div className="flex-1">
              <div className="font-bold text-sm">{p1Active.name} <span className="text-[10px] opacity-60">({spectatedMatch.p1Name})</span></div>
              <div className="flex gap-1 my-1">{p1Active.types.map((t) => <TypeChip key={t} t={t} />)}</div>
              <HpBar hp={p1Active.currentHp} maxHp={p1Active.maxHp} />
            </div>
            <MonsterArt creature={p1Active} />
          </div>
          <div style={panel} className="rounded-2xl p-3 flex items-center justify-between">
            <MonsterArt creature={p2Active} flip />
            <div className="flex-1 text-right">
              <div className="font-bold text-sm">{p2Active.name} <span className="text-[10px] opacity-60">({spectatedMatch.p2Name})</span></div>
              <div className="flex gap-1 my-1 justify-end">{p2Active.types.map((t) => <TypeChip key={t} t={t} />)}</div>
              <HpBar hp={p2Active.currentHp} maxHp={p2Active.maxHp} />
            </div>
          </div>
          <div style={{ background: "#0d0e14", border: "3px solid #262433" }} className="rounded-xl p-3 h-32 overflow-y-auto text-xs leading-relaxed">
            {(spectatedMatch.log || []).slice(-10).map((l, i) => <div key={i}>{l}</div>)}

        <div className="text-center text-xs opacity-70 py-6">Waiting for battle to begin…</div>
      )}

      <button onClick={onBack} className="text-xs opacity-60 underline text-center">back to bracket</button>
    </div>

}

function BeastforgeApp() {
  const [myId, setMyId] = useState(null);
  const [initializing, setInitializing] = useState(true);
  const [myName, setMyName] = useState("");
  const [screen, setScreen] = useState("home"); // home, create, join, lobby, draft, bracket, over
  const [selectedRegion, setSelectedRegion] = useState("emberreach");
  const [joinCode, setJoinCode] = useState("");
  const [roomCodeState, setRoomCodeState] = useState("");
  const [room, setRoom] = useState(null);
  const [match, setMatch] = useState(null);
  const [myDraft, setMyDraft] = useState(null);
  const [loading, setLoading] = useState(false);
  const [startingTournament, setStartingTournament] = useState(false);
  const [error, setError] = useState("");
  const [mySubmitted, setMySubmitted] = useState(false);
  const [showSwitchMenu, setShowSwitchMenu] = useState(false);
  const [picking, setPicking] = useState(false);
  const [copyLabel, setCopyLabel] = useState("Copy code");
  const [shake, setShake] = useState({ mine: false, opp: false });
  const [floatText, setFloatText] = useState({ mine: null, opp: null });
  const [incomingReaction, setIncomingReaction] = useState(null);
  const [spectateMatchId, setSpectateMatchId] = useState(null);
  const [spectatedMatch, setSpectatedMatch] = useState(null);
  const [showTypeChart, setShowTypeChart] = useState(false);
  const turnCounterRef = useRef(0);
  const currentMatchIdRef = useRef(null);
  const pickLockRef = useRef(false);
  const logEndRef = useRef(null);
  const prevHpRef = useRef({ myHp: null, oppHp: null, myMonId: null, oppMonId: null });
  const prevLogLenRef = useRef(0);
  const lastReactionTsRef = useRef(0);
  const victoryPlayedRef = useRef(false);

  useEffect(() => {
    let cancelled = false;
    (async () => {
      let id = await storageGet(PERSONAL_ID_KEY, false);
      if (!id) {
        id = Math.random().toString(36).slice(2) + Date.now().toString(36);
        await storageSet(PERSONAL_ID_KEY, id, false);
      }
      if (cancelled) return;
      setMyId(id);

      const active = await storageGet(ACTIVE_ROOM_KEY, false);
      if (active && active.code) {
        const r = await storageGet(roomKey(active.code), true);
        if (r && r.players.some((p) => p.id === id)) {
          setMyName(active.name || nameOf(r, id) || "");
          setRoomCodeState(active.code);
          setRoom(r);
          if (r.status === "lobby") setScreen("lobby");
          else if (r.status === "drafting") setScreen("draft");
          else if (r.status === "bracket") setScreen("bracket");
          else if (r.status === "over") setScreen("over");
        } else {
          await storageDelete(ACTIVE_ROOM_KEY, false);
        }
      }
      if (!cancelled) setInitializing(false);
    })();
    return () => { cancelled = true; };
  }, []);

  useEffect(() => {
    logEndRef.current?.scrollIntoView({ behavior: "smooth" });
  }, [match?.log?.length]);

  useEffect(() => {
    if (!myId || !["lobby", "draft", "bracket", "over"].includes(screen) || !roomCodeState) return;
    let cancelled = false;
    const tick = async () => {
      let fresh = await storageGet(roomKey(roomCodeState));
      if (!fresh || cancelled) return;

      if (fresh.status === "drafting") {
        const participants = fresh.draftParticipants || fresh.players.map((p) => p.id);
        if (participants.includes(myId)) {
          if (!pickLockRef.current) {
            const mine = await storageGet(draftKeyFor(roomCodeState, myId));
            if (mine) setMyDraft(mine);
          }
        } else {
          setMyDraft(null);
        }

        const draftStates = await Promise.all(participants.map((pid) => storageGet(draftKeyFor(roomCodeState, pid))));
        const allDone = draftStates.length > 0 && draftStates.every((d) => d && d.done);
        if (allDone) {
          const latest = await storageGet(roomKey(roomCodeState));
          if (latest && latest.status === "drafting" && latest.rev === fresh.rev) {
            const teams = { ...(latest.teams || {}) };
            participants.forEach((pid, i) => {
              teams[pid] = draftStates[i].picks.map((m) => ({ ...m, currentHp: m.maxHp }));
            });
            const roundNum = latest.draftRound || 1;
            const matchups = generateRound(participants, roundNum, latest.season);
            const updated = { ...latest, status: "bracket", teams, bracket: { round: roundNum, matchups }, rev: latest.rev + 1 };
            const ok = await commitIfRevMatches(roomKey(roomCodeState), latest, updated);
            if (ok) {
              await Promise.all(matchups.filter((m) => m.p2).map((mu) => storageSet(matchKey(roomCodeState, mu.id), buildFreshMatch(updated, mu))));
              fresh = updated;
            }
          }
        }
      } else if (fresh.status === "bracket") {
        if (fresh.bracket.matchups.every((m) => m.winner)) {
          const winners = fresh.bracket.matchups.map((m) => m.winner);
          const latest = await storageGet(roomKey(roomCodeState));
          if (latest && latest.status === "bracket" && latest.rev === fresh.rev) {
            if (winners.length === 1) {
              const updated = { ...latest, status: "over", champion: winners[0], rev: latest.rev + 1 };
              const ok = await commitIfRevMatches(roomKey(roomCodeState), latest, updated);
              if (ok) fresh = updated;
            } else {
              const nextRound = latest.bracket.round + 1;
              const region = REALMS.find((r) => r.key === latest.region) || REALMS[0];
              const pools = winners.map((pid) => ({ id: pid, pool: getPool(region.range[0], region.range[1], 10, []) }));
              const updated = { ...latest, status: "drafting", draftParticipants: winners, draftRound: nextRound, rev: latest.rev + 1 };
              const ok = await commitIfRevMatches(roomKey(roomCodeState), latest, updated);
              if (ok) {
                await Promise.all(pools.map(({ id, pool }) => storageSet(draftKeyFor(roomCodeState, id), { pool, picks: [], done: false })));
                fresh = updated;
              }
            }
          }
        }

        if (fresh.status === "bracket") {
          const myMu = fresh.bracket.matchups.find((m) => !m.winner && (m.p1 === myId || m.p2 === myId));
          if (myMu) {
            const mKey = matchKey(roomCodeState, myMu.id);
            let freshMatch = await storageGet(mKey);
            if (!freshMatch) {
              freshMatch = buildFreshMatch(fresh, myMu);
              await storageSet(mKey, freshMatch);
            }
            if (currentMatchIdRef.current !== myMu.id) {
              currentMatchIdRef.current = myMu.id;
              turnCounterRef.current = freshMatch.turnCounter || 0;
              setMySubmitted(false);
              setShowSwitchMenu(false);
              prevHpRef.current = { myHp: null, oppHp: null, myMonId: null, oppMonId: null };
              prevLogLenRef.current = 0;
              lastReactionTsRef.current = 0;
            }

            const incomingReact = await storageGet(reactKeyFor(roomCodeState, myMu.id, myId));
            if (incomingReact && incomingReact.ts !== lastReactionTsRef.current) {
              lastReactionTsRef.current = incomingReact.ts;
              setIncomingReaction(incomingReact.emoji);
              playSfx("reaction");
              setTimeout(() => setIncomingReaction(null), 2200);
            }

            if (freshMatch.status === "choose-lead") {
              const p1Lead = await storageGet(moveKeyFor(roomCodeState, myMu.id, freshMatch.p1));
              const p2Lead = await storageGet(moveKeyFor(roomCodeState, myMu.id, freshMatch.p2));
              const validLead = (v) => v && typeof v === "object" && typeof v.leadIdx === "number";
              if (validLead(p1Lead) && validLead(p2Lead)) {
                const updated = {
                  ...freshMatch,
                  status: "battle",
                  activeIdx: { [freshMatch.p1]: p1Lead.leadIdx, [freshMatch.p2]: p2Lead.leadIdx },
                  log: [
                    ...freshMatch.log,
                    `${freshMatch.p1Name} sends out ${freshMatch.teams[freshMatch.p1][p1Lead.leadIdx].name}!`,
                    `${freshMatch.p2Name} sends out ${freshMatch.teams[freshMatch.p2][p2Lead.leadIdx].name}!`,
                  ],
                  turnCounter: (freshMatch.turnCounter || 0) + 1,
                };
                if (await commitIfTurnMatches(mKey, freshMatch, updated)) {
                  await storageSet(moveKeyFor(roomCodeState, myMu.id, freshMatch.p1), null);
                  await storageSet(moveKeyFor(roomCodeState, myMu.id, freshMatch.p2), null);
                  freshMatch = updated;
                }
              }
            } else if (freshMatch.status === "battle") {
              const p1Move = await storageGet(moveKeyFor(roomCodeState, myMu.id, freshMatch.p1));
              const p2Move = await storageGet(moveKeyFor(roomCodeState, myMu.id, freshMatch.p2));
              if (freshMatch.pendingSwitch) {
                const need = freshMatch.pendingSwitch;
                const mv = need === freshMatch.p1 ? p1Move : p2Move;
                if (mv && typeof mv === "object" && "switchIdx" in mv) {
                  const mon = freshMatch.teams[need][mv.switchIdx];
                  const nameOfNeed = need === freshMatch.p1 ? freshMatch.p1Name : freshMatch.p2Name;
                  const updated = {
                    ...freshMatch,
                    activeIdx: { ...freshMatch.activeIdx, [need]: mv.switchIdx },
                    pendingSwitch: null,
                    log: [...freshMatch.log, `${nameOfNeed} sends out ${mon.name}!`],
                    turnCounter: (freshMatch.turnCounter || 0) + 1,
                  };
                  if (await commitIfTurnMatches(mKey, freshMatch, updated)) {
                    await storageSet(moveKeyFor(roomCodeState, myMu.id, need), null);
                    freshMatch = updated;
                  }
                }
              } else if (isBattleAction(p1Move) && isBattleAction(p2Move)) {
                const updated = resolveTurn(freshMatch, p1Move, p2Move);
                if (await commitIfTurnMatches(mKey, freshMatch, updated)) {
                  await storageSet(moveKeyFor(roomCodeState, myMu.id, freshMatch.p1), null);
                  await storageSet(moveKeyFor(roomCodeState, myMu.id, freshMatch.p2), null);
                  freshMatch = updated;
                }
              }
            } else if (freshMatch.status === "over" && !myMu.winner) {
              const latestRoom = await storageGet(roomKey(roomCodeState));
              if (latestRoom && latestRoom.status === "bracket") {
                const target = latestRoom.bracket.matchups.find((m) => m.id === myMu.id);
                if (target && !target.winner) {
                  const mus = latestRoom.bracket.matchups.map((m) => (m.id === myMu.id ? { ...m, winner: freshMatch.winner } : m));
                  const updated = { ...latestRoom, bracket: { ...latestRoom.bracket, matchups: mus }, rev: latestRoom.rev + 1 };
                  const ok = await commitIfRevMatches(roomKey(roomCodeState), latestRoom, updated);
                  if (ok) fresh = updated;
                }
              }
            }

            if (freshMatch.turnCounter !== turnCounterRef.current) {
              turnCounterRef.current = freshMatch.turnCounter;
              setMySubmitted(false);
              setShowSwitchMenu(false);
            }
            setMatch(freshMatch);
          } else {
            currentMatchIdRef.current = null;
            setMatch(null);
          }
        }
      }

      if (cancelled) return;
      setRoom(fresh);
      if (fresh.status === "lobby") setScreen("lobby");
      else if (fresh.status === "drafting") setScreen("draft");
      else if (fresh.status === "bracket") setScreen("bracket");
      else if (fresh.status === "over") setScreen("over");
    };
    tick();
    const id = setInterval(tick, 1800);
    return () => { cancelled = true; clearInterval(id); };
  }, [screen, roomCodeState, myId]);

  useEffect(() => {
    setSpectateMatchId(null);
    setSpectatedMatch(null);
  }, [room?.bracket?.round]);

  useEffect(() => {
    if (!spectateMatchId || !roomCodeState) { setSpectatedMatch(null); return; }
    let cancelled = false;
    const poll = async () => {
      const m = await storageGet(matchKey(roomCodeState, spectateMatchId));
      if (!cancelled) setSpectatedMatch(m);
    };
    poll();
    const id = setInterval(poll, 1800);
    return () => { cancelled = true; clearInterval(id); };
  }, [spectateMatchId, roomCodeState]);

  async function createRoom() {
    if (!myName.trim()) { setError("Enter your name first."); return; }
    setLoading(true); setError("");
    try {
      const code = genCode();
      const region = REALMS.find((r) => r.key === selectedRegion) || REALMS[0];
      const initial = {
        code, region: region.key, regionLabel: region.label,
        hostId: myId, hostName: myName.trim(),
        players: [{ id: myId, name: myName.trim() }],
        maxPlayers: 8, teamSize: 4,
        status: "lobby", teams: null, bracket: null, champion: null,
        draftParticipants: null, draftRound: 0, season: 1,
        rev: 0, createdAt: Date.now(),
      };
      await storageSet(roomKey(code), initial);
      await storageSet(ACTIVE_ROOM_KEY, { code, name: myName.trim() }, false);
      setRoomCodeState(code);
      setRoom(initial);
      setScreen("lobby");
    } catch {
      setError("Couldn't create the room. Try again.");
    }
    setLoading(false);
  }

  async function joinRoom() {
    if (!myName.trim() || !joinCode.trim()) { setError("Enter your name and a room code."); return; }
    setLoading(true); setError("");
    const code = joinCode.trim().toUpperCase();
    const existing = await storageGet(roomKey(code));
    if (!existing) { setError("Room not found. Double-check the code."); setLoading(false); return; }
    const already = existing.players.some((p) => p.id === myId);
    if (!already) {
      if (existing.status !== "lobby") { setError("This tournament has already started."); setLoading(false); return; }
      if (existing.players.length >= existing.maxPlayers) { setError("That room is full (8/8)."); setLoading(false); return; }
      const updated = { ...existing, players: [...existing.players, { id: myId, name: myName.trim() }], rev: existing.rev + 1 };
      const ok = await commitIfRevMatches(roomKey(code), existing, updated);
      if (!ok) { setError("Someone else joined at the same instant — try again."); setLoading(false); return; }
    }
    await storageSet(ACTIVE_ROOM_KEY, { code, name: myName.trim() }, false);
    const latest = await storageGet(roomKey(code));
    setRoomCodeState(code);
    setRoom(latest);
    if (latest.status === "lobby") setScreen("lobby");
    else if (latest.status === "drafting") setScreen("draft");
    else if (latest.status === "bracket") setScreen("bracket");
    else setScreen("over");
    setLoading(false);
  }

  async function startTournament() {
    if (!room || room.hostId !== myId || room.status !== "lobby" || room.players.length < 2) return;
    setStartingTournament(true); setError("");
    const latest = await storageGet(roomKey(roomCodeState));
    if (!latest || latest.hostId !== myId || latest.status !== "lobby" || latest.players.length < 2) { setStartingTournament(false); return; }
    const region = REALMS.find((r) => r.key === latest.region) || REALMS[0];
    const pools = latest.players.map((p) => ({ id: p.id, pool: getPool(region.range[0], region.range[1], 10, []) }));
    await Promise.all(pools.map(({ id, pool }) => storageSet(draftKeyFor(roomCodeState, id), { pool, picks: [], done: false })));
    const updated = { ...latest, status: "drafting", draftParticipants: latest.players.map((p) => p.id), draftRound: 1, rev: latest.rev + 1 };
    const ok = await commitIfRevMatches(roomKey(roomCodeState), latest, updated);
    if (ok) setRoom(updated);
    else setError("Couldn't start — try again.");
    setStartingTournament(false);
  }

  async function playAgain() {
    if (!room || room.hostId !== myId || room.status !== "over") return;
    setStartingTournament(true); setError("");
    const latest = await storageGet(roomKey(roomCodeState));
    if (!latest || latest.hostId !== myId || latest.status !== "over") { setStartingTournament(false); return; }
    const updated = {
      ...latest,
      status: "lobby", teams: null, bracket: null, champion: null,
      draftParticipants: null, draftRound: 0, season: (latest.season || 1) + 1,
      rev: latest.rev + 1,
    };
    const ok = await commitIfRevMatches(roomKey(roomCodeState), latest, updated);
    if (ok) {
      setRoom(updated); setScreen("lobby");
      setMatch(null); setMyDraft(null); setMySubmitted(false); setShowSwitchMenu(false);
      setSpectateMatchId(null); setSpectatedMatch(null);
      currentMatchIdRef.current = null; turnCounterRef.current = 0; victoryPlayedRef.current = false;
    } else {
      setError("Couldn't restart — try again.");
    }
    setStartingTournament(false);
  }

  async function pickMon(mon) {
    if (pickLockRef.current) return;
    pickLockRef.current = true;
    setPicking(true);
    try {
      const latest = await storageGet(draftKeyFor(roomCodeState, myId));
      if (!latest || latest.done || latest.picks.length >= (room?.teamSize || 4)) return;
      const mythicsSoFar = latest.picks.filter((p) => p.mythic).length;
      if (mon.mythic && mythicsSoFar >= MAX_MYTHIC_PICKS) return;
      const newPicks = [...latest.picks, mon];
      const done = newPicks.length >= (room?.teamSize || 4);
      const region = REALMS.find((r) => r.key === room?.region) || REALMS[0];
      const newPool = done ? [] : getPool(region.range[0], region.range[1], 10, newPicks.map((p) => p.id));
      const updated = { pool: newPool, picks: newPicks, done };
      await storageSet(draftKeyFor(roomCodeState, myId), updated);
      setMyDraft(updated);
    } finally {
      pickLockRef.current = false;
      setPicking(false);
    }
  }

  async function submitLead(idx) {
    if (mySubmitted || !match || match.status !== "choose-lead") return;
    playSfx("lock");
    setMySubmitted(true);
    await storageSet(moveKeyFor(roomCodeState, match.id, myId), { leadIdx: idx });
  }
  async function submitAction(action) {
    if (mySubmitted || !match || match.status !== "battle" || match.pendingSwitch) return;
    playSfx("lock");
    setMySubmitted(true);
    setShowSwitchMenu(false);
    await storageSet(moveKeyFor(roomCodeState, match.id, myId), action);
  }
  async function submitAttack(moveIdx) {
    await submitAction(moveIdx);
  }
  async function submitVoluntarySwitch(idx) {
    await submitAction({ switchIdx: idx });
  }
  async function submitSwitch(idx) {
    if (mySubmitted || !match || match.pendingSwitch !== myId) return;
    playSfx("lock");
    setMySubmitted(true);
    await storageSet(moveKeyFor(roomCodeState, match.id, myId), { switchIdx: idx });
  }
  async function sendReaction(emoji) {
    if (!match || !otherPid) return;
    playSfx("reaction");
    await storageSet(reactKeyFor(roomCodeState, match.id, otherPid), { emoji, ts: Date.now() });
  }

  function leaveRoom() {
    storageDelete(ACTIVE_ROOM_KEY, false);
    setScreen("home"); setRoom(null); setMatch(null); setMyDraft(null);
    setRoomCodeState(""); setJoinCode(""); setError(""); setMySubmitted(false); setShowSwitchMenu(false);
    setSpectateMatchId(null); setSpectatedMatch(null);
    turnCounterRef.current = 0; currentMatchIdRef.current = null; victoryPlayedRef.current = false;
  }

  useEffect(() => {
    if (screen === "over" && room && !victoryPlayedRef.current) {
      victoryPlayedRef.current = true;
      playSfx("victory");
    }
  }, [screen, room]);

  function copyCode() {
    const shareUrl = `${location.origin}${location.pathname}?join=${roomCodeState}`;
    navigator.clipboard?.writeText(shareUrl).then(() => {
      setCopyLabel("Copied!");
      setTimeout(() => setCopyLabel("Copy link"), 1500);
    });
  }

  useEffect(() => {
    if (!initializing && screen === "home") {
      const params = new URLSearchParams(location.search);
      const code = params.get("join");
      if (code) {
        setJoinCode(code.toUpperCase());
        setScreen("join");
      }
    }
  }, [initializing]);

  const bg = { background: "#12141C", minHeight: "100%", fontFamily: "Rubik, sans-serif" };
  const display = { fontFamily: "'Press Start 2P', monospace" };
  const panel = { background: "#EFE6D0", color: "#262433", border: "3px solid #262433" };

  const otherPid = match ? (myId === match.p1 ? match.p2 : match.p1) : null;
  const otherPname = match ? (myId === match.p1 ? match.p2Name : match.p1Name) : "";
  const myTeam = match?.teams?.[myId];
  const oppTeam = match?.teams?.[otherPid];
  const myActive = myTeam?.[match?.activeIdx?.[myId]];
  const oppActive = oppTeam?.[match?.activeIdx?.[otherPid]];

  useEffect(() => {
    if (!match || !myActive || !oppActive) return;
    const newLines = (match.log || []).slice(prevLogLenRef.current).join(" ");
    const crit = newLines.includes("critical hit");
    const noEff = newLines.includes("no effect");
    const prev = prevHpRef.current;
    if (prev.oppMonId === oppActive.id && typeof prev.oppHp === "number" && oppActive.currentHp < prev.oppHp && !noEff) {
      const dmg = prev.oppHp - oppActive.currentHp;
      playSfx(crit ? "crit" : "hit");
      setShake((s) => ({ ...s, opp: true }));
      setFloatText((f) => ({ ...f, opp: { amount: dmg, crit, key: Date.now() } }));
      setTimeout(() => setShake((s) => ({ ...s, opp: false })), 400);
      setTimeout(() => setFloatText((f) => ({ ...f, opp: null })), 900);
    }
    if (prev.myMonId === myActive.id && typeof prev.myHp === "number" && myActive.currentHp < prev.myHp && !noEff) {
      const dmg = prev.myHp - myActive.currentHp;
      playSfx(crit ? "crit" : "hit");
      setShake((s) => ({ ...s, mine: true }));
      setFloatText((f) => ({ ...f, mine: { amount: dmg, crit, key: Date.now() } }));
      setTimeout(() => setShake((s) => ({ ...s, mine: false })), 400);
      setTimeout(() => setFloatText((f) => ({ ...f, mine: null })), 900);
    }
    if (newLines.includes("fainted")) playSfx("faint");
    prevHpRef.current = { myHp: myActive.currentHp, oppHp: oppActive.currentHp, myMonId: myActive.id, oppMonId: oppActive.id };
    prevLogLenRef.current = (match.log || []).length;
  }, [match?.log?.length, myActive?.currentHp, oppActive?.currentHp, myActive?.id, oppActive?.id]);

  return (
    <div style={bg} className="w-full min-h-full flex flex-col items-center p-3 text-[#EFE6D0]">
      <style>{`@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;500;700;900&display=swap');`}</style>

      {showTypeChart && <TypeChart onClose={() => setShowTypeChart(false)} />}

      <div className="w-full max-w-md flex items-center justify-between mt-2 mb-2">
        <div style={{ width: 74 }} />
        <h1 style={{ ...display, color: "#E8B23D", fontSize: "12px", lineHeight: 1.6 }} className="text-center">
          BEASTFORGE
        </h1>
        <button
          onClick={() => setShowTypeChart(true)}
          style={{ background: "#EFE6D0", color: "#262433" }}
          className="text-[10px] font-bold px-2 py-1.5 rounded-lg active:scale-95 transition whitespace-nowrap"
        >
          📖 Types
        </button>
      </div>

      {initializing && (
        <div className="mt-16 text-center opacity-80 text-sm animate-pulse">Reconnecting…</div>
      )}

      {!initializing && screen === "home" && (
        <div className="flex flex-col items-center gap-4 mt-6 w-full max-w-xs">
          <p className="text-sm opacity-80 text-center">Draft a team of original creatures and battle 1–7 friends in a knockout tournament. Share a room code to play.</p>
          <input
            value={myName} onChange={(e) => setMyName(e.target.value)} placeholder="Your trainer name"
            style={{ background: "#EFE6D0", color: "#262433" }} className="w-full rounded-lg px-3 py-2 text-sm"
          />
          {error && <div className="text-xs text-[#D64545]">{error}</div>}
          <button onClick={() => setScreen("create")} style={{ background: "#D64545", ...display, fontSize: "10px" }} className="w-full px-4 py-3 rounded-xl text-white active:scale-95 transition">
            HOST A ROOM
          </button>
          <button onClick={() => setScreen("join")} style={{ background: "#3FA796", ...display, fontSize: "10px" }} className="w-full px-4 py-3 rounded-xl text-white active:scale-95 transition">
            JOIN A ROOM
          </button>
        </div>
      )}

      {screen === "create" && (
        <div className="flex flex-col items-center gap-3 w-full max-w-sm">
          <input
            value={myName} onChange={(e) => setMyName(e.target.value)} placeholder="Your trainer name"
            style={{ background: "#EFE6D0", color: "#262433" }} className="w-full rounded-lg px-3 py-2 text-sm"
          />
          <div style={{ ...display, fontSize: "10px" }} className="text-[#E8B23D]">CHOOSE A REALM</div>
          <div className="grid grid-cols-2 gap-2 w-full">
            {REALMS.map((r) => (
              <button
                key={r.key} onClick={() => setSelectedRegion(r.key)}
                style={{ background: selectedRegion === r.key ? "#E8B23D" : "#EFE6D0", color: "#262433", border: "3px solid #262433" }}
                className="rounded-xl p-2 text-left"
              >
                <div className="font-bold text-xs">{r.label}</div>
              </button>
            ))}
          </div>
          {error && <div className="text-xs text-[#D64545]">{error}</div>}
          <button onClick={createRoom} disabled={loading} style={{ background: "#D64545", ...display, fontSize: "10px" }} className="w-full px-4 py-3 rounded-xl text-white disabled:opacity-60">
            {loading ? "SUMMONING…" : "CREATE ROOM"}
          </button>
          <button onClick={() => setScreen("home")} className="text-xs opacity-60 underline">back</button>
        </div>
      )}

      {screen === "join" && (
        <div className="flex flex-col items-center gap-3 w-full max-w-xs">
          <input
            value={myName} onChange={(e) => setMyName(e.target.value)} placeholder="Your trainer name"
            style={{ background: "#EFE6D0", color: "#262433" }} className="w-full rounded-lg px-3 py-2 text-sm"
          />
          <input
            value={joinCode} onChange={(e) => setJoinCode(e.target.value.toUpperCase())} placeholder="ROOM CODE"
            style={{ background: "#EFE6D0", color: "#262433", ...display, fontSize: "11px", letterSpacing: "2px" }}
            className="w-full rounded-lg px-3 py-3 text-center"
          />
          {error && <div className="text-xs text-[#D64545]">{error}</div>}
          <button onClick={joinRoom} disabled={loading} style={{ background: "#3FA796", ...display, fontSize: "10px" }} className="w-full px-4 py-3 rounded-xl text-white disabled:opacity-60">
            {loading ? "JOINING…" : "JOIN ROOM"}
          </button>
          <button onClick={() => setScreen("home")} className="text-xs opacity-60 underline">back</button>
        </div>
      )}

      {screen === "lobby" && room && (
        <div className="flex flex-col items-center gap-4 mt-6 text-center w-full max-w-xs">
          <div style={{ ...display, fontSize: "9px" }} className="text-[#3FA796]">ROOM CODE</div>
          <div style={{ ...display, fontSize: "22px", letterSpacing: "4px", color: "#E8B23D" }}>{roomCodeState}</div>
          <button onClick={copyCode} style={{ background: "#EFE6D0", color: "#262433" }} className="px-3 py-1 rounded-lg text-xs font-bold">{copyLabel}</button>
          <p className="text-xs opacity-70 max-w-xs">{room.regionLabel} knockout · 2–8 players · Share the code (or copied link) with friends.</p>
          <div className="w-full flex flex-col gap-1">
            {room.players.map((p) => (
              <div key={p.id} style={panel} className="rounded-lg px-3 py-2 text-left text-sm font-bold">
                {p.name}{p.id === room.hostId ? " (Host)" : ""}{p.id === myId ? " · You" : ""}
              </div>
            ))}
          </div>
          <div className="text-xs opacity-60">{room.players.length} / {room.maxPlayers} joined</div>
          {room.hostId === myId ? (
            <button
              onClick={startTournament}
              disabled={room.players.length < 2 || startingTournament}
              style={{ background: "#D64545", ...display, fontSize: "10px" }}
              className="w-full px-4 py-3 rounded-xl text-white disabled:opacity-50"
            >
              {startingTournament ? "SUMMONING…" : room.players.length < 2 ? "NEED 2+ PLAYERS" : `START KNOCKOUT (${room.players.length})`}
            </button>
          ) : (
            <div className="animate-pulse text-xs opacity-60">Waiting for host to start…</div>
          )}
          {error && <div className="text-xs text-[#D64545]">{error}</div>}
          <button onClick={leaveRoom} className="text-xs opacity-60 underline">leave</button>
        </div>
      )}

      {screen === "draft" && room && (
        <div className="w-full max-w-md flex flex-col gap-3">
          <div style={{ ...display, fontSize: "9px" }} className="text-center text-[#3FA796]">
            DRAFT YOUR TEAM{room.draftRound ? ` · ROUND ${room.draftRound}` : ""}
          </div>
          {room.draftParticipants && !room.draftParticipants.includes(myId) ? (
            <div className="text-center text-xs opacity-70 py-10">You were eliminated — spectating while the remaining trainers draft for round {room.draftRound}…</div>
          ) : !myDraft ? (
            <div className="text-center text-xs opacity-70 py-6 animate-pulse">Summoning your options…</div>
          ) : myDraft.done ? (
            <div className="text-center text-xs opacity-70 py-6">Team locked in! Waiting for other trainers…</div>
          ) : picking ? (
            <div className="text-center text-xs opacity-70 py-6 animate-pulse">Finding your next options…</div>
          ) : (
            <>
              <div className="text-[10px] text-center opacity-60">
                {room.regionLabel} · Pick {myDraft.picks.length + 1} of {room.teamSize} · Mythics {myDraft.picks.filter((p) => p.mythic).length}/{MAX_MYTHIC_PICKS}
              </div>
              <div className="grid grid-cols-2 gap-2">
                {myDraft.pool.map((mon) => {
                  const mythicCapped = mon.mythic && myDraft.picks.filter((p) => p.mythic).length >= MAX_MYTHIC_PICKS;
                  return (
                    <button key={mon.id} onClick={() => pickMon(mon)} disabled={picking || mythicCapped}
                      style={panel} className="rounded-2xl p-2 flex flex-col items-center gap-1 active:scale-95 transition disabled:opacity-60">
                      <MonsterArt creature={mon} />
                      <div className="font-bold text-xs">{mon.name}</div>
                      <TierStars tier={mon.tier} />
                      {mon.mythic && <MythicBadge />}
                      <div className="flex gap-1">{mon.types.map((t) => <TypeChip key={t} t={t} />)}</div>
                      {mythicCapped && <div className="text-[9px] text-[#D64545] font-bold">Limit reached</div>}
                    </button>
                  );
                })}
              </div>
            </>
          )}
          {myDraft && myDraft.picks.length > 0 && (
            <div className="flex gap-1 flex-wrap justify-center mt-1">
              {myDraft.picks.map((m) => <MonsterArt key={m.id} creature={m} size={36} />)}
            </div>
          )}
        </div>
      )}

      {screen === "bracket" && room && (
        match ? (
          <div className="w-full max-w-md flex flex-col gap-2">
            <div style={{ ...display, fontSize: "9px" }} className="text-center text-[#E8B23D]">ROUND {room.bracket?.round}</div>

            {match.status === "choose-lead" ? (
              <div className="flex flex-col gap-3">
                <div style={{ ...display, fontSize: "10px" }} className="text-center text-[#E8B23D]">CHOOSE YOUR LEAD CREATURE</div>
                <p className="text-xs text-center opacity-70">vs {otherPname}</p>
                {mySubmitted ? (
                  <div className="text-center text-xs opacity-70 py-4">Lead locked in — waiting for {otherPname}…</div>
                ) : (
                  <div className="grid grid-cols-2 gap-2">
                    {match.teams[myId].map((m, i) => (
                      <button key={m.id} onClick={() => submitLead(i)} style={panel} className="rounded-2xl p-2 flex flex-col items-center gap-1 active:scale-95 transition">
                        <MonsterArt creature={m} />
                        <div className="font-bold text-xs">{m.name}</div>
                        <div className="flex gap-1">{m.types.map((t) => <TypeChip key={t} t={t} />)}</div>
                      </button>
                    ))}
                  </div>
                )}
              </div>
            ) : myActive && oppActive ? (
              <>
                {incomingReaction && (
                  <div
                    key={incomingReaction + Date.now()}
                    style={{ position: "fixed", top: "18%", left: "50%", transform: "translateX(-50%)", fontSize: "64px", zIndex: 60, animation: "bf-pop-in 0.3s ease" }}
                    className="pointer-events-none drop-shadow-lg"
                  >
                    {incomingReaction}
                  </div>
                )}

                <div style={panel} className={`rounded-2xl p-3 flex items-center justify-between ${shake.opp ? "bf-shake-anim" : ""}`}>
                  <div className="flex-1">
                    <div className="font-bold text-sm">{oppActive.name} <span className="text-[10px] opacity-60">({otherPname})</span></div>
                    <div className="flex gap-1 my-1">{oppActive.types.map((t) => <TypeChip key={t} t={t} />)}</div>
                    <HpBar hp={oppActive.currentHp} maxHp={oppActive.maxHp} />
                  </div>
                  <div style={{ position: "relative" }} className={shake.opp ? "bf-flash-anim" : ""}>
                    <MonsterArt creature={oppActive} />
                    {floatText.opp && (
                      <div
                        key={floatText.opp.key}
                        style={{ position: "absolute", top: "-4px", right: "-4px", fontFamily: "'Press Start 2P', monospace", fontSize: floatText.opp.crit ? "16px" : "13px", color: floatText.opp.crit ? "#E8B23D" : "#D64545", animation: "bf-float-up 0.85s ease forwards", textShadow: "1px 1px 0 #12141C" }}
                      >
                        -{floatText.opp.amount}
                      </div>
                    )}
                  </div>
                </div>

                <div style={panel} className={`rounded-2xl p-3 flex items-center justify-between ${shake.mine ? "bf-shake-anim" : ""}`}>
                  <div style={{ position: "relative" }} className={shake.mine ? "bf-flash-anim" : ""}>
                    <MonsterArt creature={myActive} flip />
                    {floatText.mine && (
                      <div
                        key={floatText.mine.key}
                        style={{ position: "absolute", top: "-4px", left: "-4px", fontFamily: "'Press Start 2P', monospace", fontSize: floatText.mine.crit ? "16px" : "13px", color: floatText.mine.crit ? "#E8B23D" : "#D64545", animation: "bf-float-up 0.85s ease forwards", textShadow: "1px 1px 0 #12141C" }}
                      >
                        -{floatText.mine.amount}
                      </div>
                    )}
                  </div>
                  <div className="flex-1 text-right">
                    <div className="font-bold text-sm">{myActive.name} <span className="text-[10px] opacity-60">(You)</span></div>
                    <div className="flex gap-1 my-1 justify-end">{myActive.types.map((t) => <TypeChip key={t} t={t} />)}</div>
                    <HpBar hp={myActive.currentHp} maxHp={myActive.maxHp} />
                  </div>
                </div>

                <div style={{ background: "#0d0e14", border: "3px solid #262433" }} className="rounded-xl p-3 h-24 overflow-y-auto text-xs leading-relaxed">
                  {(match.log || []).slice(-6).map((l, i) => <div key={i}>{l}</div>)}
                  <div ref={logEndRef} />
                </div>

                {match.pendingSwitch === myId && (
                  mySubmitted ? (
                    <div className="text-center text-xs opacity-70 py-2">Switch locked in — waiting for {otherPname}…</div>
                  ) : (
                    <div className="flex flex-col gap-2">
                      <div style={{ ...display, fontSize: "9px" }} className="text-center text-[#D64545]">CHOOSE YOUR NEXT CREATURE</div>
                      <div className="grid grid-cols-3 gap-2">
                        {myTeam.map((m, i) => (
                          <button key={m.id} disabled={m.currentHp <= 0} onClick={() => submitSwitch(i)} style={panel} className="rounded-xl p-2 flex flex-col items-center disabled:opacity-30">
                            <MonsterArt creature={m} size={48} />
                            <div className="text-[10px] font-bold">{m.name}</div>
                          </button>
                        ))}
                      </div>
                    </div>
                  )
                )}

                {match.pendingSwitch && match.pendingSwitch !== myId && (
                  <div className="text-center text-xs opacity-70 py-2">{otherPname} is choosing their next creature…</div>
                )}

                {!match.pendingSwitch && (
                  mySubmitted ? (
                    <div className="text-center text-xs opacity-70 py-2">Locked in — waiting for {otherPname}…</div>
                  ) : showSwitchMenu ? (
                    <div className="flex flex-col gap-2">
                      <div style={{ ...display, fontSize: "9px" }} className="text-center text-[#3FA796]">SWITCH TO…</div>
                      <div className="grid grid-cols-3 gap-2">
                        {myTeam.map((m, i) => (
                          <button
                            key={m.id}
                            disabled={m.currentHp <= 0 || i === match.activeIdx[myId]}
                            onClick={() => submitVoluntarySwitch(i)}
                            style={panel}
                            className="rounded-xl p-2 flex flex-col items-center disabled:opacity-30"
                          >
                            <MonsterArt creature={m} size={48} />
                            <div className="text-[10px] font-bold">{m.name}</div>
                          </button>
                        ))}
                      </div>
                      <button onClick={() => setShowSwitchMenu(false)} className="text-xs opacity-60 underline">back to moves</button>
                    </div>
                  ) : (
                    <div className="flex flex-col gap-2">
                      <div className="grid grid-cols-2 gap-2">
                        {myActive.moves.map((m, i) => (
                          <button key={m.name} onClick={() => submitAttack(i)} style={{ background: TYPE_COLORS[m.type] || "#888" }} className="rounded-xl p-2 text-white text-left active:scale-95 transition">
                            <div className="font-bold text-xs">{m.name}</div>
                            <div className="text-[10px] opacity-90">{m.type.toUpperCase()} · PWR {m.power}</div>
                          </button>
                        ))}
                      </div>
                      {myTeam.some((m, i) => m.currentHp > 0 && i !== match.activeIdx[myId]) && (
                        <button onClick={() => setShowSwitchMenu(true)} style={{ background: "#262433", ...display, fontSize: "9px" }} className="w-full px-3 py-2 rounded-xl text-[#EFE6D0] active:scale-95 transition">
                          SWITCH CREATURE
                        </button>
                      )}
                    </div>
                  )
                )}

                <div className="flex gap-2 justify-center">
                  {["😤", "😂", "🔥", "😱", "👏"].map((e) => (
                    <button key={e} onClick={() => sendReaction(e)} style={{ background: "#1c1e2a", border: "2px solid #262433" }} className="text-lg px-2 py-1 rounded-lg active:scale-90 transition">
                      {e}
                    </button>
                  ))}
                </div>

                <div className="flex gap-1 justify-center mt-1">
                  {myTeam.map((m, i) => (
                    <div key={m.id} style={{ opacity: m.currentHp <= 0 ? 0.3 : i === match.activeIdx[myId] ? 1 : 0.7, border: i === match.activeIdx[myId] ? "2px solid #E8B23D" : "2px solid transparent" }} className="rounded-lg p-0.5">
                      <MonsterArt creature={m} size={32} />
                    </div>
                  ))}
                </div>
              </>
            ) : (
              <div className="text-center text-xs opacity-70 py-6">Loading match…</div>
            )}
          </div>
        ) : spectateMatchId ? (
          <SpectatorView spectatedMatch={spectatedMatch} onBack={() => setSpectateMatchId(null)} />
        ) : (
          <BracketOverview room={room} myId={myId} onWatch={setSpectateMatchId} />
        )
      )}

      {screen === "over" && room && (
        <div className="flex flex-col items-center gap-3 mt-10">
          <Confetti />
          <div style={{ ...display, fontSize: "13px", color: room.champion === myId ? "#3FA796" : "#E8B23D" }}>
            {room.champion === myId ? "YOU ARE THE CHAMPION!" : "TOURNAMENT OVER"}
          </div>
          <p className="text-xs opacity-70">{nameOf(room, room.champion)} wins the {room.players.length}-player knockout!</p>
          {room.hostId === myId && (
            <button onClick={playAgain} disabled={startingTournament} style={{ background: "#3FA796", ...display, fontSize: "10px" }} className="px-4 py-3 rounded-xl text-white disabled:opacity-60">
              {startingTournament ? "RESETTING…" : "PLAY AGAIN · SAME ROOM"}
            </button>
          )}
          {error && <div className="text-xs text-[#D64545]">{error}</div>}
          <button onClick={leaveRoom} style={{ background: "#D64545", ...display, fontSize: "10px" }} className="px-4 py-2 rounded-lg text-white">
            LEAVE / NEW ROOM
          </button>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<BeastforgeApp />);
</script>
<script>
  (function () {
    const source = document.getElementById("app-source").textContent;
    try {
      const { code } = Babel.transform(source, {
        presets: [["react", { runtime: "classic" }]],
      });
      (0, eval)(code);
    } catch (e) {
      document.getElementById("root").innerHTML =
        '<pre style="color:#D64545;background:#12141C;padding:16px;white-space:pre-wrap;">App failed to start:\n' +
        (e && e.message ? e.message : String(e)) +
        "</pre>";
      console.error(e);
    }
  })();
</script>
</body>
</html>
